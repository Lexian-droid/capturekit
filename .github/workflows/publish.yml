name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Check tag matches package version
        shell: python
        run: |
          import os
          import pathlib
          import re

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version_file = pathlib.Path("src/capturekit/_version.py").read_text()
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', version_file, re.MULTILINE)
          if not match:
              raise SystemExit("Could not read __version__ from src/capturekit/_version.py")
          package_version = match.group(1)
          if package_version != tag_version:
              raise SystemExit(
                  f"Tag version {tag_version!r} does not match package version {package_version!r}"
              )

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/capturekit/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
